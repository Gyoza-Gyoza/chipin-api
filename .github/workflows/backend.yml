name: Backend CI

on:
  push:
    branches:
      - main
  

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_NAME: chipin_test
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: chipin_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres

        ports:
          - 5432:5432

        options: >- 
          --health-cmd="pg_isready -U postgres -d chipin_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checks directory
        run: |
          pwd
          ls
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify application imports
        run: python -c "import main"

      - name: Build Docker image
        run: docker build -t chipin-api .

      - name: Create database schema
        run: |
          psql \
            --host="$DATABASE_HOST" \
            --port="$DATABASE_PORT" \
            --username="$DATABASE_USER" \
            --dbname="$DATABASE_NAME" \
            --file=database/schema.sql
        env:
          PGPASSWORD: ${{ env.DATABASE_PASSWORD }}

      - name: Run tests
        run: python -m pytest tests --junitxml=test_results.xml

      - name: Parse test results
        if: always()
        id: parse_tests
        run: python test_results/parse_test.py

    outputs:
      test_count: ${{ steps.parse_tests.outputs.test_count }}
      test_successes: ${{ steps.parse_tests.outputs.test_successes }}
      test_errors: ${{ steps.parse_tests.outputs.test_errors }}
      test_failures: ${{ steps.parse_tests.outputs.test_failures }}
      test_skipped: ${{ steps.parse_tests.outputs.test_skipped }}
      failed_tests: ${{ steps.parse_tests.outputs.failed_tests }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Run build
        run: |
          STATUS=$(curl \
            -o response.json \
            -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.DEPLOY_TOKEN }}" \
            https://deploy.gyozas.dev/deploy)
          echo $STATUS
          if [ "$STATUS" != "200" ]; then
            exit 1
          fi 

  notify:
    if: always()
    continue-on-error: true
    needs:
      - build
      - deploy
    runs-on: ubuntu-latest
    steps:
      - name: Send notification
        run: |
          JOB_STATUS=""
          
          append_status(){
            local name="$1"
            local status="$2"
          
            JOB_STATUS+="$name: "
            
            case "$status" in 
              success)
                JOB_STATUS+="SUCCESS"
                ;;
              failure)
                JOB_STATUS+="FAILURE"
                ;;
              skipped)
                JOB_STATUS+="SKIPPED"
                ;;
              cancelled)
                JOB_STATUS+="CANCELLED"
                ;;
              *)
                JOB_STATUS+="UNKNOWN"
                ;;
          esac
          
          JOB_STATUS+=$'\n'
          }
          
          append_status "Build" "${{ needs.build.result }}"
          append_status "Deploy" "${{ needs.deploy.result }}"
          
          MESSAGE="
          Deployment Pipeline $STATUS
          
          Repository: ${{ github.repository }}
          Branch: ${{ github.ref_name }}
          Commit: ${{ github.event.head_commit.message }}
          Run: #${{ github.run_number }}
          
          Tests run: ${{ needs.build.outputs.test_count }}
          Successes: ${{ needs.build.outputs.test_successes }}
          Errors: ${{ needs.build.outputs.test_errors }}
          Failures: ${{ needs.build.outputs.test_failures }}
          Skipped: ${{ needs.build.outputs.test_skipped }}
          
          Failed tests: 
          ${{ needs.build.outputs.failed_tests }}
          
          $JOB_STATUS
          https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          
          curl -v \
          -X POST \
          https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
          -H "Content-Type: application/json" \
          -d "{
            \"chat_id\":\"${{ secrets.TELEGRAM_CHAT_ID }}\",
            \"text\":\"$MESSAGE\"
          }"

  notify-discord:
    needs:
      - build
      - deploy
    runs-on: ubuntu-latest
    steps:
      - name: Send discord notification
        run: |
          curl -v \
          -X POST ${{ secrets.DISCORD_WEBHOOK_URL }} \
          -H "Content-Type: application/json" \
          -d '{
            "content": "New build up: ${{ github.event.head_commit.message }}"
          }'
